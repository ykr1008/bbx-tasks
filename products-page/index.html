<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore our featured products and special offers."
    />
    <title>ShopEase | Products</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="#" class="logo">Shop<span>Ease.</span></a>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="#">Home</a>
        <a href="#products">Products</a>
        <a href="#offers">Offers</a>
      </nav>

      <a href="#products" class="header-button">Shop Now ↗</a>
    </header>

    <main id="products" class="product-section">
      <h2>Featured Products</h2>

      <div class="product-grid">
        <article class="product-card">
          <span class="sale-badge">SALE</span>
          <div class="product-image">
            <img src="images/sneakers.jpg" alt="Classic white sneakers" />
          </div>
          <div class="product-info">
            <h3>Classic Sneakers</h3>
            <p class="price">₹1,499</p>
            <button type="button" class="cart-button">Add to Cart</button>
          </div>
        </article>

        <article class="product-card">
          <span class="sale-badge">SALE</span>
          <div class="product-image">
            <img src="images/watch.jpg" alt="Classic wristwatch" />
          </div>
          <div class="product-info">
            <h3>Classic Watch</h3>
            <p class="price">₹1,999</p>
            <button type="button" class="cart-button">Add to Cart</button>
          </div>
        </article>

        <article class="product-card">
          <span class="sale-badge">SALE</span>
          <div class="product-image">
            <img src="images/backpack.jpg" alt="Everyday backpack" />
          </div>
          <div class="product-info">
            <h3>Everyday Backpack</h3>
            <p class="price">₹1,199</p>
            <button type="button" class="cart-button">Add to Cart</button>
          </div>
        </article>

        <article class="product-card">
          <span class="sale-badge">SALE</span>
          <div class="product-image">
            <img src="images/headphones.jpg" alt="Wireless headphones" />
          </div>
          <div class="product-info">
            <h3>Wireless Headphones</h3>
            <p class="price">₹2,499</p>
            <button type="button" class="cart-button">Add to Cart</button>
          </div>
        </article>

        <article class="product-card">
          <span class="sale-badge">SALE</span>
          <div class="product-image">
            <img src="images/sunglasses.jpg" alt="Modern sunglasses" />
          </div>
          <div class="product-info">
            <h3>Modern Sunglasses</h3>
            <p class="price">₹899</p>
            <button type="button" class="cart-button">Add to Cart</button>
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
