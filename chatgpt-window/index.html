<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatGPT Window Demo</title>
    <link rel="stylesheet" href="style.css" />
    <meta
      name="description"
      content="rebuilding the chatgpt window using html and css"
    />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <a href="#">ChatGPT</a>
          <button type="button" aria-label="Search chats">⌕</button>
          <button type="button" aria-label="Collapse sidebar">☰</button>
        </div>

        <div class="sidebar-content">
          <nav class="sidebar-nav" aria-label="Main navigation">
            <a href="#">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path>
              </svg>
              <span>New chat</span>
            </a>

            <a href="#">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-4-4"></path>
              </svg>
              <span>Search chats</span>
            </a>

            <a href="#">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="3"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <path d="m21 15-5-5L5 21"></path>
              </svg>
              <span>Images</span>
            </a>

            <a href="#">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="2"></rect>
                <rect x="14" y="3" width="7" height="7" rx="2"></rect>
                <rect x="3" y="14" width="7" height="7" rx="2"></rect>
                <rect x="14" y="14" width="7" height="7" rx="2"></rect>
              </svg>
              <span>Apps</span>
            </a>

            <a href="#">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3 4 7v10l8 4 8-4V7Z"></path>
                <path d="m4 7 8 4 8-4"></path>
                <path d="M12 11v10"></path>
              </svg>
              <span>Codex</span>
            </a>

            <a href="#">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="10.5" cy="10.5" r="6.5"></circle>
                <path d="m15.5 15.5 5 5"></path>
                <path d="M8 10.5h5"></path>
                <path d="M10.5 8v5"></path>
              </svg>
              <span>Deep research</span>
            </a>

            <a href="#">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="4"></rect>
                <path d="m10 9 5 3-5 3Z"></path>
              </svg>
              <span>Sora</span>
            </a>
          </nav>

          <section class="projects">
            <h2>Projects</h2>
            <a href="#">＋ <span>New project</span></a>
          </section>

          <section class="recent-chats">
            <h2>Recents</h2>
            <ul>
              <li><a href="#">ChatGPT UI styling</a></li>
              <li><a href="#">CSS layout practice</a></li>
              <li><a href="#">Learning JavaScript</a></li>
            </ul>
          </section>
        </div>

        <div class="sidebar-profile">
          <div class="profile-info">
            <strong>Yadhu Krishnan R</strong>
            <span>Free plan</span>
          </div>
          <button type="button">Upgrade plan</button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="topbar-right">
            <button type="button" class="upgrade-button">Upgrade</button>
          </div>
        </header>

        <section class="welcome">
          <h1>What can I help with?</h1>

          <div class="suggestions">
            <button type="button" class="suggestion-card">
              <span class="suggestion-icon" aria-hidden="true">✏️</span>
              <span>Write something</span>
            </button>

            <button type="button" class="suggestion-card">
              <span class="suggestion-icon" aria-hidden="true">💡</span>
              <span>Get advice</span>
            </button>

            <button type="button" class="suggestion-card">
              <span class="suggestion-icon" aria-hidden="true">📚</span>
              <span>Learn something</span>
            </button>

            <button type="button" class="suggestion-card">
              <span class="suggestion-icon" aria-hidden="true">💻</span>
              <span>Code something</span>
            </button>
          </div>
        </section>

        <form class="chat-form">
          <label class="visually-hidden" for="message-input">
            Message ChatGPT
          </label>

          <textarea
            id="message-input"
            name="message"
            placeholder="Message ChatGPT"
            rows="1"
          ></textarea>

          <div class="composer-actions">
            <button
              type="button"
              class="attach-button"
              aria-label="Add attachment"
            >
              +
            </button>

            <div class="composer-right">
              <button type="button" aria-label="Use microphone">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <rect x="9" y="2" width="6" height="12" rx="3"></rect>
                  <path d="M5 10a7 7 0 0 0 14 0"></path>
                  <path d="M12 17v5"></path>
                  <path d="M8 22h8"></path>
                </svg>
              </button>

              <button
                type="submit"
                class="send-button"
                aria-label="Send message"
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M12 19V5"></path>
                  <path d="m5 12 7-7 7 7"></path>
                </svg>
              </button>
            </div>
          </div>
        </form>
        <footer class="footer">
          <p class="disclaimer">
            ChatGPT can make mistakes. Check important information.
          </p>
        </footer>
      </main>
    </div>
  </body>
</html>
