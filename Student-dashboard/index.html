
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student Profile Dashboard">
    <title>Student Profile Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation bar -->
    <nav class="navbar">
        <a href="#" class="logo">StudentHub</a>

        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#courses">Courses</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Main page content -->
    <main class="container">

        <h1>Student Profile Dashboard</h1>

        <!-- Student profile card -->
        <section class="profile-card" id="home">

            <span class="badge">New</span>

            <img
                src="https://placehold.co/120x120"
                alt="Student profile"
                class="profile-image"
            >

            <h2>Alex Johnson</h2>
            <p class="course-name">Full Stack Web Development</p>

            <p class="description">
                Passionate about web development, problem-solving,
                and building creative digital experiences.
            </p>

            <a href="#about" class="profile-button">View Profile</a>

        </section>

    </main>

</body>
</html>
