<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card</title>
    <meta
      name="description"
      content="three cards made up of css, bootsrap and tailwind"
    />
    <link rel="stylesheet" href="style.css" />

    <!-- Card 2: Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Card 3: Tailwind CSS (learning/demo use) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  </head>

  <body>
    <main>
      <section class="cards">

        <!-- card  1 -->
        <div class="card-1">
          <img
            src="https://www.pngmart.com/files/23/Profile-PNG-Photo.png"
            alt="Profile icon"
            class="profile-icon"
          />
          <h2>John Doe</h2>
          <span>Frontend Developer</span>
          <a href="#" class="profile-btn">View Profile</a>
        </div>

        <!-- card 2 -->
        <div
          class="card shadow border-0 rounded-4 p-4 pt-4.5 text-center card-boot"
          style="width: 300px"
        >
          <img
            src="https://www.pngmart.com/files/23/Profile-PNG-Photo.png"
            alt="John Doe's profile"
            class="rounded-circle mb-3 d-block mx-auto"
            style="width: 72px; height: 72px; object-fit: cover"
          />
          <h2 class="h3 mb-3">John Doe</h2>
          <p class="text-secondary mb-4">Frontend Developer</p>

          <a href="#" class="btn btn-primary w-100 h-14 py-3"
            >View Profile</a
          >
        </div>

        <!-- Card 3: Tailwind CSS -->
        <div
          class="w-[300px] rounded-xl bg-white p-15 text-center shadow-lg"
          style="padding: 24px;"
        >
          <img
            src="https://www.pngmart.com/files/23/Profile-PNG-Photo.png"
            alt="John Doe's profile"
            class="mx-auto mb-4 h-[72px] w-[72px] rounded-full object-cover"
          />

          <h2 class="mb-3 text-3xl font-bold text-gray-800">John Doe</h2>

          <p class="mb-6 text-gray-500">Frontend Developer</p>

          <a
            href="#"
            class="block w-full rounded-lg bg-blue-600 px-4 py-3 text-white  transition hover:bg-blue-700 !no-underline"
          >
            View Profile
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
